name: Deploy PET-Saúde Clima

on:
  push:
    branches: [ main ]

jobs:

# ==========================================================================
# BUILD + PUSH DAS 3 IMAGENS (api, worker-email, frontend)
# ==========================================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ---- API -------------------------------------------------------
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.api
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-api:${{ github.sha }}

      # ---- Worker de e-mail -------------------------------------------
      - name: Build & push worker-email
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.email
          push: true
          cache-from: type=gha,scope=worker-email
          cache-to: type=gha,mode=max,scope=worker-email
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-worker-email:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-worker-email:${{ github.sha }}

      # ---- Frontend -----------------------------------------------------
      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_APP_KEY=${{ secrets.VITE_APP_KEY }}
            VITE_LIVEKIT_URL=ws://petsaudeclima.mooo.com/livekit
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-frontend:${{ github.sha }}

# ==========================================================================
# DEPLOY NO SERVIDOR (self-hosted runner)
# ==========================================================================
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      # Corrige arquivos que ficaram como root (ex: certbot/conf) antes do
      # checkout tentar limpar o workspace.
      - name: Corrigir permissões do workspace
        run: sudo chown -R $USER:$USER ${{ github.workspace }}

      - uses: actions/checkout@v4

      # ---- Gera backend/.env a partir dos Secrets ----------------------
      - name: Gerar backend/.env
        run: |
          cat > backend/.env <<EOF
          APP_NAME=PET-Saúde Clima
          PORT=8080
          TOKEN_KEY=${{ secrets.TOKEN_KEY }}
          APP_KEY=${{ secrets.APP_KEY }}

          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=${{ secrets.MYSQL_DATABASE }}
          DB_USERNAME=root
          DB_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}

          FRONTEND_URL=${{ secrets.FRONTEND_URL }}

          RABBIT_URL=amqp://${{ secrets.RABBITMQ_DEFAULT_USER }}:${{ secrets.RABBITMQ_DEFAULT_PASS }}@rabbitmq:5672/

          MAIL_MAILER=smtp
          MAIL_HOST=${{ secrets.MAIL_HOST }}
          MAIL_PORT=${{ secrets.MAIL_PORT }}
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_ENCRYPTION=tls
          MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME="PET-Saúde Clima"
          VERIFICATION_SECRET=${{ secrets.VERIFICATION_SECRET }}

          LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}
          LIVEKIT_URL=ws://petsaudeclima.mooo.com/livekit
          LIVEKIT_PUBLIC_URL=ws://petsaudeclima.mooo.com/livekit

          UPLOAD_DIR=/app/uploads
          EOF

      # ---- Gera o .env de infraestrutura (variáveis do compose) --------
      - name: Gerar .env do docker-compose
        run: |
          cat > .env <<EOF
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG=${{ github.sha }}
          MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE=${{ secrets.MYSQL_DATABASE }}
          RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }}
          RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }}
          VITE_API_URL=${{ secrets.VITE_API_URL }}
          VITE_APP_KEY=${{ secrets.VITE_APP_KEY }}
          EOF

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Sobe tudo via docker compose ---------------------------------
      - name: Deploy (docker compose)
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Limpar imagens antigas
        run: docker image prune -f