name: Deploy PET-Saúde Clima

on:
  push:
    branches: [ main ]

jobs:

# ==========================================================================
# BUILD + PUSH DAS 3 IMAGENS (api, worker-email, frontend)
# ==========================================================================
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ---- API -------------------------------------------------------
      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.api
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-api:${{ github.sha }}

      # ---- Worker de e-mail -------------------------------------------
      - name: Build & push worker-email
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/docker/Dockerfile.email
          push: true
          cache-from: type=gha,scope=worker-email
          cache-to: type=gha,mode=max,scope=worker-email
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-worker-email:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-worker-email:${{ github.sha }}

      # ---- Frontend -----------------------------------------------------
      - name: Build & push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_APP_KEY=${{ secrets.VITE_APP_KEY }}
            VITE_LIVEKIT_URL=wss://petsaudeclima.prp.uespi.br/livekit
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/petsaude-frontend:${{ github.sha }}

# ==========================================================================
# DEPLOY NO SERVIDOR (self-hosted runner)
# ==========================================================================
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      # ---- Restaura os .env que vivem fora do workspace ----------------
      # O checkout apaga tudo que não está no Git. Por isso os .env ficam
      # em /opt/petsaude/ (fora do workspace) e são copiados pra dentro
      # agora, já depois da limpeza do checkout.
      - name: Restaurar .envs do servidor
        run: |
          cp /opt/petsaude/.env ./.env
          cp /opt/petsaude/backend.env ./backend/.env

      # ---- Atualiza IMAGE_TAG com o SHA do commit atual ----------------
      # O .env do servidor tem IMAGE_TAG=latest como fallback; aqui
      # sobrescrevemos com a tag exata que o build-and-push publicou.
      - name: Atualizar IMAGE_TAG
        run: |
          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ github.sha }}|" ./.env

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ---- Sobe tudo via docker compose ---------------------------------
      - name: Deploy (docker compose)
        run: |
          docker compose pull
          docker compose up -d --remove-orphans

      - name: Limpar imagens antigas
        run: docker image prune -f