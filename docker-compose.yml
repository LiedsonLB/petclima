# Pipeline local/produção do PET-Saúde Clima.
#
# Duas camadas de configuração:
#   - `.env` (raiz, fora do controle de versão) -> só variáveis usadas pelo
#     PRÓPRIO docker-compose (senha do mysql/rabbitmq, tags de imagem, args
#     de build do frontend). Veja `.env.example`.
#   - `backend/.env` -> config da aplicação Go (SMTP, chaves, etc.), lida
#     pelos containers `api` e `worker-email` via `env_file`. Veja
#     `backend/.env.example`.

services:
  mysql:
    image: mysql:8.0
    container_name: petsaude-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-petsaude_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petsaude}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-petsaude_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - petsaude-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: petsaude-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-petsaude}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-petsaude_rabbit}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - petsaude-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50009:50000-50009/udp"  # Portas RTC para mídia
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "devkey: 7xK9mP2qR4sT8vW3yZ5cF6hJ1nL4oB8aD0"
    networks:
      - petsaude-network

  # ---- API (Go) ---------------------------------------------------------
  # api:
  #   image: ${DOCKERHUB_USERNAME}/petsaude-api:${IMAGE_TAG:-latest}
  #   container_name: petsaude-api
  #   restart: unless-stopped
