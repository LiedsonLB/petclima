  #     - ./backend/.env
  #   environment:
  #     DB_HOST: mysql
  #     RABBIT_URL: amqp://${RABBITMQ_DEFAULT_USER:-petsaude}:${RABBITMQ_DEFAULT_PASS:-petsaude_rabbit}@rabbitmq:5672/
  #     LIVEKIT_URL: wss://petsaudeclima.mooo.com/livekit
  #     LIVEKIT_PUBLIC_URL: wss://petsaudeclima.mooo.com/livekit
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #     rabbitmq:
  #       condition: service_healthy
  #   # ── Volume de uploads persistente: as imagens sobrevivem aos deploys ──
  #   volumes:
