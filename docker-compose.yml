# Pipeline local/produção do PET-Saúde Clima.
#
# Os arquivos .env NÃO ficam no repo. Eles vivem em /opt/petsaude/ no
# servidor e são copiados para dentro do workspace no momento do deploy
# (ver .github/workflows/deploy.yml, passo "Restaurar .envs").

services:
  mysql:
    image: mysql:8.0
    container_name: petsaude-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-petsaude_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petsaude}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-petsaude_root}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - petsaude-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: petsaude-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-petsaude}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-petsaude_rabbit}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - petsaude-network

  livekit:
    image: livekit/livekit-server:latest
    container_name: livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50009:50000-50009/udp"  # Portas RTC para mídia
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    environment:
      # Tem que ser IGUAL ao LIVEKIT_API_KEY/LIVEKIT_API_SECRET do backend.env
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    networks:
      - petsaude-network

  # ---- API (Go) ---------------------------------------------------------
  api:
    image: ${DOCKERHUB_USERNAME}/petsaude-api:${IMAGE_TAG:-latest}
    container_name: petsaude-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
      RABBIT_URL: amqp://${RABBITMQ_DEFAULT_USER:-petsaude}:${RABBITMQ_DEFAULT_PASS:-petsaude_rabbit}@rabbitmq:5672/
      LIVEKIT_URL: wss://petsaudeclima.prp.uespi.br/livekit
      LIVEKIT_PUBLIC_URL: wss://petsaudeclima.prp.uespi.br/livekit
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks:
      - petsaude-network

  # ---- Worker de e-mail (Go) --------------------------------------------
  worker-email:
    image: ${DOCKERHUB_USERNAME:-local}/petsaude-worker-email:${IMAGE_TAG:-latest}
    container_name: petsaude-worker-email
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      RABBIT_URL: amqp://${RABBITMQ_DEFAULT_USER:-petsaude}:${RABBITMQ_DEFAULT_PASS:-petsaude_rabbit}@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - petsaude-network

  # ---- Frontend (React + Nginx) ------------------------------------------
  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/petsaude-frontend:${IMAGE_TAG:-latest}
    container_name: petsaude-frontend
    restart: unless-stopped
    environment:
      - BACKEND_HOST=api
      - LIVEKIT_HOST=livekit
    ports:
      - "80:80"
    depends_on:
      - api
      - livekit
    volumes:
      - uploads_data:/app/uploads:ro
    networks:
      - petsaude-network

volumes:
  mysql_data:
  rabbitmq_data:
  uploads_data:

networks:
  petsaude-network:
    driver: bridge