  #   networks:
  #     - petsaude-network

  # ---- Worker de e-mail (Go) --------------------------------------------
  # worker-email:
  #   image: ${DOCKERHUB_USERNAME:-local}/petsaude-worker-email:${IMAGE_TAG:-latest}
  #   container_name: petsaude-worker-email
